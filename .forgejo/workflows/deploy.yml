name: Deploy to Codeberg Pages

on: push

env:
  HUGO_VERSION: "0.139.0"

jobs:
  deploy:
    runs-on: codeberg-tiny
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          set -eu
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz hugo
          install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: Snapshot toh.json (fallback if live fetch is rate-limited)
        run: |
          set -eu
          mkdir -p static/toh
          # openwrt.org rejects requests without a browser-like UA.
          curl -fsSL -A "Mozilla/5.0 openwrt-website-build" \
            https://openwrt.org/toh.json -o static/toh/data.json
          ls -la static/toh/data.json

      - name: Build
        run: hugo --minify --gc

      - name: Publish to git-pages
        uses: actions/git-pages@v2
        with:
          site: https://aparcar.codeberg.page/openwrt-org/
          token: ${{ forge.token }}
          source: public
