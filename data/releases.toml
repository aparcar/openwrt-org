# Single source of truth for OpenWrt release lifecycle.
# Bump entries here; the support-status table in /security/ and any other
# templated reference (via .Site.Data.releases) updates automatically.
#
# status values:  supported | maintenance | eol
# status_label is what gets rendered in the badge.
# Order top-to-bottom = newest series first.

