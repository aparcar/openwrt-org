<div class="table-scroll">
<table class="release-table">
  <thead>
    <tr>
      <th>Series</th>
      <th>Status</th>
      <th>Initial release</th>
      <th>Latest minor</th>
      <th>Latest release date</th>
      <th>EoL (projected)</th>
    </tr>
  </thead>
  <tbody>
    {{- range $.Site.Data.releases.releases }}
    <tr>
      <td>{{ .series }}</td>
      <td><span class="status status-{{ .status }}">{{ .status_label }}</span></td>
      <td>{{ .initial }}</td>
      <td>{{ .latest }}</td>
      <td>{{ .latest_date }}</td>
      <td>{{ .eol }}</td>
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
