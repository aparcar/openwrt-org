name: Deploy to GitHub Pages

# GitHub counterpart of .forgejo/workflows/deploy.yml — keep the build steps
# in sync between the two.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.139.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          set -eu
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: Snapshot toh.json (fallback if live fetch is rate-limited)
        run: |
          set -eu
          mkdir -p static/toh
          # openwrt.org rejects requests without a browser-like UA.
          curl -fsSL -A "Mozilla/5.0 openwrt-website-build" \
            https://openwrt.org/toh.json -o static/toh/data.json
          ls -la static/toh/data.json

      - name: Split toh.json into per-device files
        run: |
          set -eu
          # jq ships with ubuntu-latest; double-check.
          command -v jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends jq)
          sh scripts/split-toh.sh

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # baseURL (including the /openwrt-org/ sub-path) comes from hugo.toml.
        run: hugo --minify --gc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
